<!DOCTYPE html>
<html>
<head>
    <title>Cobrinha</title>
    <style>
        body {
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas { border: 2px solid green; }
        #controles {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 5px;
            margin-top: 15px;
        }
        #controles button {
            background: #222;
            color: white;
            border: 2px solid green;
            border-radius: 8px;
            font-size: 28px;
            cursor: pointer;
            touch-action: manipulation;
        }
        #controles button:active { background: green; }
    </style>
</head>
<body>
    <canvas id="jogo" width="400" height="400"></canvas>
    <div id="controles">
        <div></div>
        <button onclick="ir(0,-1)">⬆️</button>
        <div></div>
        <button onclick="ir(-1,0)">⬅️</button>
        <button onclick="ir(0,1)">⬇️</button>
        <button onclick="ir(1,0)">➡️</button>
    </div>
    <script>
        const canvas = document.getElementById("jogo");
        const ctx = canvas.getContext("2d");
        const TAM = 20;
        const COLUNAS = canvas.width / TAM;
        const LINHAS = canvas.height / TAM;

        let cobra = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
        let direcao = {x:1,y:0};
        let comida = gerarComida();
        let pontos = 0;
        let rodando = true;

        function ir(dx, dy) {
            if (dx === 0 && direcao.y !== dy) direcao = {x:dx, y:dy};
            if (dy === 0 && direcao.x !== dx) direcao = {x:dx, y:dy};
        }

        function gerarComida() {
            return {
                x: Math.floor(Math.random() * COLUNAS),
                y: Math.floor(Math.random() * LINHAS)
            };
        }

        function mover() {
            let cabeca = {
                x: cobra[0].x + direcao.x,
                y: cobra[0].y + direcao.y
            };
            cobra.unshift(cabeca);
            if (cabeca.x === comida.x && cabeca.y === comida.y) {
                pontos++;
                comida = gerarComida();
            } else {
                cobra.pop();
            }
        }

        function verificarColisao() {
            let cabeca = cobra[0];
            if (cabeca.x < 0 || cabeca.x >= COLUNAS) return true;
            if (cabeca.y < 0 || cabeca.y >= LINHAS) return true;
            for (let i = 1; i < cobra.length; i++) {
                if (cabeca.x === cobra[i].x && cabeca.y === cobra[i].y) return true;
            }
            return false;
        }

        function desenhar() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red";
            ctx.fillRect(comida.x * TAM, comida.y * TAM, TAM, TAM);
            for (let i = 0; i < cobra.length; i++) {
                ctx.fillStyle = i === 0 ? "lime" : "green";
                ctx.fillRect(cobra[i].x * TAM, cobra[i].y * TAM, TAM, TAM);
            }
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Pontos: " + pontos, 10, 20);
            if (!rodando) {
                ctx.fillStyle = "yellow";
                ctx.font = "bold 30px Arial";
                ctx.fillText("GAME OVER!", 80, 200);
                ctx.font = "18px Arial";
                ctx.fillText("Toque em reiniciar!", 90, 240);
            }
        }

        function reiniciar() {
            cobra = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
            direcao = {x:1,y:0};
            comida = gerarComida();
            pontos = 0;
            rodando = true;
            loop();
        }
