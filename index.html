<!DOCTYPE html>
<html>
<head>
    <title>Cobrinha</title>
    <style>
        body {
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas { border: 2px solid green; }
        .btn {
            background: #222;
            color: white;
            border: 2px solid green;
            border-radius: 8px;
            font-size: 20px;
            width: 70px;
            height: 70px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn:active { background: green; }
        #controles {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 5px;
            margin-top: 15px;
        }
        #btnReiniciar {
            margin-top: 10px;
            background: #222;
            color: white;
            border: 2px solid green;
            border-radius: 8px;
            font-size: 18px;
            padding: 10px 30px;
            cursor: pointer;
            touch-action: manipulation;
            display: none;
        }
        #btnReiniciar:active { background: green; }
    </style>
</head>
<body>
    <canvas id="jogo" width="400" height="400"></canvas>
    <div id="controles"></div>
    <button id="btnReiniciar">REINICIAR</button>
    <script>
        const canvas = document.getElementById("jogo");
        const ctx = canvas.getContext("2d");
        const TAM = 20;
        const COLUNAS = canvas.width / TAM;
        const LINHAS = canvas.height / TAM;

        let cobra = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
        let direcao = {x:1,y:0};
        let proximaDirecao = {x:1,y:0};
        let comida = gerarComida();
        let pontos = 0;
        let rodando = true;

        document.getElementById("btnReiniciar").addEventListener("click", reiniciar);
        document.getElementById("btnReiniciar").addEventListener("touchstart", function(e) {
            e.preventDefault();
            reiniciar();
        });

        const controles = document.getElementById("controles");
        const botoes = [
            {label:"", dx:0, dy:0},
            {label:"^", dx:0, dy:-1},
            {label:"", dx:0, dy:0},
            {label:"<", dx:-1, dy:0},
            {label:"v", dx:0, dy:1},
            {label:">", dx:1, dy:0},
        ];

        botoes.forEach(function(b) {
            if (b.label === "") {
                const div = document.createElement("div");
                controles.appendChild(div);
            } else {
                const btn = document.createElement("button");
                btn.className = "btn";
                btn.textContent = b.label;
                btn.addEventListener("click", function() {
                    ir(b.dx, b.dy);
                });
                btn.addEventListener("touchstart", function(e) {
                    e.preventDefault();
                    ir(b.dx, b.dy);
                });
                controles.appendChild(btn);
            }
        });

        function ir(dx, dy) {
            // Impede voltar na direção oposta
            if (dx === 1 && direcao.x === -1) return;
            if (dx === -1 && direcao.x === 1) return;
            if (dy === 1 && direcao.y === -1) return;
            if (dy === -1 && direcao.y === 1) return;
            proximaDirecao = {x:dx, y:dy};
        }

        function gerarComida() {
            return {
                x: Math.floor(Math.random() * COLUNAS),
                y: Math.floor(Math.random() * LINHAS)
            };
        }

        function mover() {
            direcao = proximaDirecao;
            let cabeca = {
                x: cobra[0].x + direcao.x,
                y: cobra[0].y + direcao.y
            };
            cobra.unshift(cabeca);
            if (cabeca.x === comida.x && cabeca.y === comida.y) {
                pontos++;
                comida = gerarComida();
            } else {
                cobra.pop();
            }
        }

        function verificarColisao() {
            let cabeca = cobra[0];
            if (cabeca.x < 0 || cabeca.x >= COLUNAS) return true;
            if (cabeca.y < 0 || cabeca.y >= LINHAS) return true;
            // Colisão com ela mesma só a partir do 3o segmento
            for (let i = 3; i < cobra.length; i++) {
                if (cabeca.x === cobra[i].x && cabeca.y === cobra[i].y) return true;
            }
            return false;
        }

        function desenhar() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red";
            ctx.fillRect(comida.x * TAM, comida.y * TAM, TAM, TAM);
            for (let i = 0; i < cobra.length; i++) {
                ctx.fillStyle = i === 0 ? "lime" : "green";
                ctx.fillRect(cobra[i].x * TAM, cobra[i].y * TAM, TAM, TAM);
            }
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Pontos: " + pontos, 10, 20);
            if (!rodando) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "yellow";
                ctx.font = "bold 30px Arial";
                ctx.fillText("GAME OVER!", 80, 180);
                ctx.fillStyle = "white";
                ctx.font = "18px Arial";
                ctx.fillText("Pontos: " + pontos, 160, 220);
                document.getElementById("btnReiniciar").style.display = "block";
            }
        }

        function reiniciar() {
            cobra = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
            direcao = {x:1,y:0};
            proximaDirecao = {x:1,y:0};
            comida = gerarComida();
            pontos = 0;
            rodando = true;
            document.getElementById("btnReiniciar").style.display = "none";
            loop();
        }

        function loop() {
            mover();
            if (verificarColisao()) {
                rodando = false;
                desenhar();
                return;
            }
            desenhar();
            setTimeout(loop, 100);
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowUp") ir(0,-1);
            if (e.key === "ArrowDown") ir(0,1);
            if (e.key === "ArrowLeft") ir(-1,0);
            if (e.key === "ArrowRight") ir(1,0);
            if (e.key === "Enter" && !rodando) reiniciar();
        });

        loop();
    </script>
</body>
</html>
