<!DOCTYPE html>
<html>
  <head>
    <title>Cobrinha</title>
    <style>
      body {
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        }
      canvas {
        border: 2px solid green;
        }
        </style>
  </head>
  <body>
    <canvas id= "jogo" width= "600" height= "600"></canvas>
 <script>
   const canvas = document.getElementById("jogo");
   const ctx = canvas.getContext("2d");

   const TAM = 25;
   const COLUNAS = canvas.width / TAM;
   const LINHAS = canvas.height / TAM;

   let cobra = [{x:5, y:5}, {x:4, y:5}, {x:3, y:5}];
   let direcao = {x:1, y:0};
   let comida = gerarComida();
   let pontos = 0;
   let rodando = true;
   function gerarComida() {
     return{
       x: Math.floor(Math.random() * COLUNAS),
       y: Math.floor(Math.random() * LINHAS)
     }
       }
   function mover() {
     let cabeca = {
       x: cobra[0].x + direcao.x,
       y: cobra[0].y + direcao.y
     }
       cobra.unshift(cabeca);

       if (cabeca.x === comida.x && cabeca.y === comida.y) {
       pontos++;
       comida = gerarComida();
     } else {
       cobra.pop();
     }
   }
   function verificarColisao() {
     let cabeca = cobra[0];
     if (cabeca.x < 0 || cabeca.x >= COLUNAS) return true;
     if(cabeca.y <0 || cabeca.y >= LINHAS) return true;
     for (let i = 1; i <cobra.length; i++) {
       if (cabeca.x === cobra[i].x && cabeca.y === cobra[i].y) return true;
     }
     return false;
     function desenhar() {
       ctx.fillStyle = "black";
       ctx.fillRect(0, 0, canvas.width, canvas.height);

       ctx.fillStyle = "red;
         ctx.fillOval(comida.x * TAM, comida.y * TAM, TAM, TAM);

       for (let i = 0; i <cobra.length; i++) {
         ctx.fillStyle = i === 0 ? "line" : "green";
         ctx.fillRect(cobra[i].x * TAM, cobra[i].y * TAM, TAM, TAM);
       }
       ctx.fillStyle = "white";
       ctx.font = "20px Arial";
       ctx.fillText("Pontos: " + pontos, 10, 20);
       if (!rodando) {
         ctx.fillStyle = "yellow";
         ctx.font = "bolt 40px Arial";
         ctx.fillText("GAME OVER!", 150, 300);
         ctx.font = "20px Arial";
         ctx.fillText("Enter para Recomeçar", 170, 340);
       }
     }
     function loop() {
       mover();
       if (verificarColisao()) {
         rodando = false;
       }
       desenhar();
       if (rodando) setTimeout(loop, 150);
     }
     document.addEventListener("keydown", function(e) {
       if (e.key === "ArrowUp" && direcao.y !== 1) direcao = {x:0, y:-1};
       if (e.key === "ArrowDown" && direcao.y !== -1) direcao = {x:0, y:1};
       if (e.key === "ArrowLeft" && direcao.x !== 1) direcao = {x:-1, y:0};
       if (e.key === "ArrowRight" && direcao.x !==-1) direcao = {x:1, y:0};
       if (e.key === "Enter" && !rodando) {
         cobra = [{x:5, y:5}, {x:4, y:5}, {x:3, y:5}];
         direcao = {x:1, y:0};
         comida = gerarComida();
         pontos = 0;
         rodando = true;
         loop();
       }
     });
   }
 </script>
</html>
